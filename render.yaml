# AgendApp — Render Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: agendapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agendapp-db
          property: connectionString
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false          # Configurar manualmente en dashboard Render
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: AgendApp <noreply@agendapp.co>
      - key: TWILIO_ACCOUNT_SID
        sync: false          # Pegar SID de Twilio
      - key: TWILIO_AUTH_TOKEN
        sync: false          # Pegar Auth Token de Twilio
      - key: WHATSAPP_FROM
        value: whatsapp:+573190000000   # Tu número WhatsApp Business 319
      - key: REMINDER_HOURS_BEFORE
        value: "24"
      - key: CANCELLATION_HOURS_BEFORE
        value: "24"

databases:
  - name: agendapp-db
    databaseName: agendapp
    user: agendapp_user
    plan: free
    region: oregon

# Cron job para recordatorios de citas (RF-04)
# Nota: Render free tier no incluye cron nativo.
# Alternativa: usar cron-job.org apuntando a /internal/send-reminders
# Header: X-Cron-Secret: <tu_SECRET_KEY>
