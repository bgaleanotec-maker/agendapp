{% extends "base.html" %}
{% block title %}500 — Error del servidor{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-warning fw-bold">500</div>
  <h4 class="mt-2">Error interno del servidor</h4>
  <p class="text-muted">Algo salió mal. Nuestro equipo ha sido notificado.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">
    <i class="bi bi-arrow-clockwise me-2"></i>Intentar de nuevo
  </a>
</div>
{% endblock %}
